<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nocturne · 剧场</title>
  <script src="/auth-guard.js"></script>
  <link rel="stylesheet" href="/theater-ui.css">
  <script>
    // 跟首页共用同一个夜间模式开关
    try {
      if (localStorage.getItem('saudade-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  </script>
  <style>
    /* 给右下角加号留出空间 */
    body {
      padding-bottom: calc(112px + var(--safe));
    }

    .script-list {
      display: grid;
      gap: 14px;
      margin-top: 14px;
    }

    .script-card {
      padding: 22px;
      border-radius: var(--r-card);
      background: var(--card);
      box-shadow: var(--shadow-card);
    }

    .script-card h2 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.015em;
    }

    .script-card .sub {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .script-card .premise {
      margin: 0 0 20px;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.78;
      /* 只留 3 行预览，太长的背景不再占满整屏 */
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .script-actions {
      display: flex;
      gap: 10px;
    }

    .script-actions button {
      flex: 1;
      min-height: 46px;
      padding: 0 12px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 15px;
      font-weight: 590;
    }

    .script-actions button:first-child {
      flex: 2;
    }

    .script-actions button.ghost {
      background: var(--fill);
      color: var(--ink);
    }

    /* 找回删掉的剧情：一行小字入口 + 弹层里的列表 */
    .recover-link {
      display: block;
      width: 100%;
      margin: 10px 0 0;
      padding: 10px 2px;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 12px;
      text-align: left;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .recover-hint {
      margin: -4px 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .recover-list {
      display: grid;
      gap: 8px;
      max-height: 46vh;
      overflow-y: auto;
      margin-bottom: 14px;
    }

    .recover-row {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      color: inherit;
      font: inherit;
      text-align: left;
    }

    .recover-row .recover-title {
      font-size: 14px;
      font-weight: 600;
    }

    .recover-row .recover-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .recover-row:disabled {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <header>
    <button class="back" onclick="nocturneBack()" type="button">‹</button>
    <h1>剧场</h1>
  </header>

  <div class="script-list" id="scriptList">加载中...</div>
  <button class="recover-link" id="recoverBtn" type="button">删掉的剧情？从自动备份里找回</button>

  <button class="fab" id="addBtn" type="button">+</button>

  <div class="modal-backdrop" id="recoverBackdrop">
    <div class="modal">
      <h2>找回删掉的剧情</h2>
      <p class="recover-hint">从每天的自动备份里翻，最近 7 天删掉的都能找回来；找回的会是一份新的剧情，原标题后面缀「（找回）」。</p>
      <div class="recover-list" id="recoverList">正在翻备份…</div>
      <div class="modal-actions">
        <button class="ghost" id="recoverClose" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2 id="modalTitle">新建剧本</h2>

      <form id="scriptForm">
        <div class="field">
          <label>剧本标题</label>
          <input id="title" placeholder="" required>
        </div>

        <div class="field">
          <label>副标题</label>
          <input id="subtitle" placeholder="">
        </div>

        <div class="field">
          <label>背景</label>
          <textarea id="premise" placeholder="故事发生在哪里，基本设定是什么"></textarea>
        </div>

        <div class="field">
          <label>开场</label>
          <textarea id="opening" placeholder="进入故事时看到的第一段剧情"></textarea>
        </div>

        <div class="field">
          <label>世界规则</label>
          <textarea id="rules" placeholder="这个副本的基本设定"></textarea>
        </div>

        <div class="modal-actions">
          <button type="submit">保存剧本</button>
          <button class="ghost" id="cancelBtn" type="button">取消</button>
        </div>

        <div id="status">等待操作。</div>
      </form>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function loadScripts() {
      const list = $('scriptList');

      try {
        const response = await fetch('/api/theater/scripts');
        const rows = await response.json();

        if (!rows.length) {
          list.innerHTML = '<div class="empty">还没有剧本，点右下角黑色加号新建。</div>';
          return;
        }

        list.innerHTML = rows.map((row) => `
          <div class="script-card">
            <h2>${escapeHtml(row.title)}</h2>
            <p class="sub">${escapeHtml(row.subtitle || '未命名副本')}</p>
            <p class="premise">${escapeHtml(row.premise || '还没有写背景。')}</p>
            <div class="script-actions">
              <button data-enter="${row.id}" type="button">进入剧本</button>
              <button class="ghost" data-edit="${row.id}" type="button">编辑</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(error.message) + '</div>';
      }
    }

    let editingScript = null;

    function openModal(script) {
      editingScript = script || null;
      $('modalTitle').textContent = editingScript ? '编辑剧本' : '新建剧本';

      $('title').value = editingScript ? (editingScript.title || '') : '';
      $('subtitle').value = editingScript ? (editingScript.subtitle || '') : '';
      $('premise').value = editingScript ? (editingScript.premise || '') : '';
      $('opening').value = editingScript ? (editingScript.opening || '') : '';
      $('rules').value = editingScript ? (editingScript.rules || '') : '';

      $('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      $('modalBackdrop').classList.remove('open');
      $('status').textContent = '等待操作。';
      editingScript = null;
      $('scriptForm').reset();
    }

    // ---- 找回删掉的剧情 ----
    function formatStamp(value) {
      const date = new Date(value || 0);
      if (!date.getTime()) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return (date.getMonth() + 1) + '月' + date.getDate() + '日 ' +
        pad(date.getHours()) + ':' + pad(date.getMinutes());
    }

    async function openRecover() {
      const list = $('recoverList');
      list.innerHTML = '正在翻备份…';
      $('recoverBackdrop').classList.add('open');

      try {
        const response = await fetch('/api/theater/recover/list');
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '翻备份失败');
        }

        const items = Array.isArray(data.items) ? data.items : [];

        if (!items.length) {
          list.innerHTML = '<div class="recover-hint">备份里没有找到被删掉的剧情（只能找回最近 7 天，而且是每天启动时存的那份）。</div>';
          return;
        }

        list.innerHTML = items.map((item) => `
          <button class="recover-row" type="button"
                  data-recover="${item.session_id}"
                  data-snapshot="${escapeHtml(item.snapshot)}">
            <div class="recover-title">${escapeHtml(item.title || '未命名剧情')}</div>
            <div class="recover-sub">${item.message_count} 条消息 · 最后动过 ${escapeHtml(formatStamp(item.updated_at))}</div>
          </button>
        `).join('');
      } catch (error) {
        list.innerHTML = '<div class="recover-hint">' + escapeHtml(error.message) + '</div>';
      }
    }

    function closeRecover() {
      $('recoverBackdrop').classList.remove('open');
    }

    $('recoverBtn').addEventListener('click', openRecover);
    $('recoverClose').addEventListener('click', closeRecover);

    $('recoverBackdrop').addEventListener('click', (event) => {
      if (event.target === $('recoverBackdrop')) closeRecover();
    });

    $('recoverList').addEventListener('click', async (event) => {
      const row = event.target.closest('[data-recover]');
      if (!row) return;

      if (!confirm('把这段剧情从自动备份里找回来？会生成一份新的剧情。')) return;

      row.disabled = true;

      try {
        const response = await fetch('/api/theater/recover', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: Number(row.dataset.recover),
            snapshot: row.dataset.snapshot || ''
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '找回失败');
        }

        location.href = '/theater-play.html?session=' + data.session_id;
      } catch (error) {
        alert(error.message);
        row.disabled = false;
      }
    });

    $('addBtn').addEventListener('click', () => openModal(null));
    $('cancelBtn').addEventListener('click', closeModal);

    $('modalBackdrop').addEventListener('click', (event) => {
      if (event.target === $('modalBackdrop')) closeModal();
    });

    $('scriptForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const payload = {
        title: $('title').value.trim(),
        subtitle: $('subtitle').value.trim(),
        premise: $('premise').value.trim(),
        opening: $('opening').value.trim(),
        rules: $('rules').value.trim(),
        cast_ids: editingScript && Array.isArray(editingScript.cast_ids)
          ? editingScript.cast_ids
          : [],
        identities: editingScript && Array.isArray(editingScript.identities)
          ? editingScript.identities
          : []
      };

      if (!payload.title) {
        $('status').textContent = '剧本标题必填';
        return;
      }

      try {
        $('status').textContent = '保存中...';

        const url = editingScript
          ? '/api/theater/scripts/' + editingScript.id
          : '/api/theater/scripts';

        const response = await fetch(url, {
          method: editingScript ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '保存失败');
        }

        closeModal();
        await loadScripts();
      } catch (error) {
        $('status').textContent = '保存失败：' + error.message;
      }
    });

    $('scriptList').addEventListener('click', async (event) => {
      const enterId = event.target.dataset.enter;
      const editId = event.target.dataset.edit;

      if (enterId) {
        location.href = '/theater-identity.html?script=' + enterId;
        return;
      }

      if (editId) {
        try {
          const response = await fetch('/api/theater/scripts/' + editId);
          const script = await response.json();

          if (!response.ok) {
            throw new Error(script.error || '读取剧本失败');
          }

          openModal(script);
        } catch (error) {
          alert('读取剧本失败：' + error.message);
        }
      }
    });

    loadScripts();
  </script>
  <script src="/back-nav.js"></script>
</body>
</html>
