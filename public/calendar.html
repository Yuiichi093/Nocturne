<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nocturne · 生日与节日</title>
  <script src="/auth-guard.js"></script>
  <style>
    :root {
      --bg: #f7f7f7;
      --ink: #111;
      --muted: #777;
      --line: rgba(0,0,0,.1);
      --card: #fff;
      --safe: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 18px 18px calc(30px + var(--safe));
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans SC", "PingFang SC", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .back {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--ink);
      font-size: 18px;
    }

    h1 {
      flex: 1;
      margin: 0;
      font-size: 28px;
      font-weight: 500;
    }

    .world-label {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 11px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
    }

    .tabs button {
      padding: 10px 6px;
      border: 0;
      border-radius: 15px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
    }

    .tabs button.active {
      background: var(--ink);
      color: var(--bg);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .section-head button {
      padding: 9px 12px;
      border: 1px solid var(--ink);
      border-radius: 13px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
      font-size: 11px;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
    }

    .item-main {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 14px;
      font-weight: 600;
    }

    .item-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .item-toggle {
      width: 22px;
      height: 22px;
      accent-color: var(--ink);
    }

    .item-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .item-actions button {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 10px;
    }

    .birthday-input {
      width: 140px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: transparent;
      color: var(--ink);
      outline: none;
      font: inherit;
      font-size: 11px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      overflow: hidden;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--bg);
      color: var(--muted);
      font-size: 13px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .empty {
      padding: 34px 18px;
      border: 1px dashed var(--line);
      border-radius: 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
    }

    .note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: flex-end;
      background: rgba(0,0,0,.35);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      padding: 18px 18px calc(22px + var(--safe));
      border-radius: 28px 28px 0 0;
      background: var(--bg);
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 600;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .field label {
      color: var(--muted);
      font-size: 11px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      color: var(--ink);
      outline: none;
      font: inherit;
    }

    .check-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      font-size: 13px;
    }

    .check-row input {
      width: 18px;
      height: 18px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .modal-actions button {
      flex: 1;
      padding: 13px;
      border: 1px solid var(--ink);
      border-radius: 15px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
    }

    .modal-actions button.ghost {
      background: transparent;
      color: var(--ink);
    }

    #status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <button class="back" onclick="nocturneBack()" type="button">‹</button>
    <h1>生日与节日</h1>
  </header>

  <p class="world-label" id="worldLabel">当前世界：加载中...</p>

  <div class="tabs">
    <button class="active" data-tab="universal" type="button">通用节日</button>
    <button data-tab="world" type="button">世界节日</button>
    <button data-tab="birthday" type="button">角色生日</button>
  </div>

  <div class="panel active" id="universalPanel">
    <div class="list" id="holidayList">加载中...</div>
    <p class="note">通用节日所有世界共享，每个世界可以单独停用。</p>
  </div>

  <div class="panel" id="worldPanel">
    <div class="section-head">
      <span>当前世界专属节日</span>
      <button id="addWorldEventBtn" type="button">+ 新建</button>
    </div>
    <div class="list" id="worldEventList">加载中...</div>
  </div>

  <div class="panel" id="birthdayPanel">
    <div class="item" style="margin-bottom:8px;">
      <div class="item-main">
        <div class="item-name">我的生日</div>
        <div class="item-sub">所有世界观通用</div>
      </div>
      <input class="birthday-input" id="userBirthdayInput" placeholder="例如：10-03">
    </div>

    <div class="list" id="birthdayList">加载中...</div>
    <p class="note">角色生日只属于当前世界。</p>
  </div>

  <div class="modal-backdrop" id="eventModal">
    <div class="modal">
      <h2 id="eventModalTitle">新建世界节日</h2>

      <form id="eventForm">
        <div class="field">
          <label>节日名字</label>
          <input id="eventName" required>
        </div>

        <div class="field">
          <label>日期 / 规则</label>
          <input id="eventRule" placeholder="例如：每年 3月14日 / 雨季第一天">
        </div>

        <div class="check-row">
          <span>启用</span>
          <input id="eventEnabled" type="checkbox" checked>
        </div>

        <div class="modal-actions">
          <button type="submit">保存</button>
          <button class="ghost" id="cancelEventBtn" type="button">取消</button>
        </div>

        <div id="status">等待操作。</div>
      </form>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    let editingEventId = null;

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    document.querySelectorAll('.tabs button').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach((item) => {
          item.classList.toggle('active', item === button);
        });

        document.querySelectorAll('.panel').forEach((panel) => {
          panel.classList.toggle(
            'active',
            panel.id === button.dataset.tab + 'Panel'
          );
        });
      });
    });

    async function loadWorldLabel() {
      try {
        const response = await fetch('/api/worlds/active');
        const world = await response.json();
        if (response.ok) {
          $('worldLabel').textContent = '当前世界：' + world.name;
        }
      } catch (e) {}
    }

    async function loadHolidays() {
      try {
        const response = await fetch('/api/holidays');
        const rows = await response.json();

        if (!rows.length) {
          $('holidayList').innerHTML = '<div class="empty">还没有通用节日。</div>';
          return;
        }

        $('holidayList').innerHTML = rows.map((row) => `
          <div class="item">
            <div class="item-main">
              <div class="item-name">${escapeHtml(row.name)}</div>
              <div class="item-sub">${escapeHtml(row.rule_text)}</div>
            </div>
            <input class="item-toggle" type="checkbox"
              data-holiday-id="${row.id}" ${row.enabled ? 'checked' : ''}>
          </div>
        `).join('');
      } catch (error) {
        $('holidayList').innerHTML =
          '<div class="empty">加载失败：' + escapeHtml(error.message) + '</div>';
      }
    }

    $('holidayList').addEventListener('change', async (event) => {
      const input = event.target.closest('[data-holiday-id]');
      if (!input) return;

      const id = input.dataset.holidayId;
      const enabled = input.checked;

      try {
        const response = await fetch('/api/holidays/' + id + '/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '设置失败');
        }
      } catch (error) {
        input.checked = !enabled;
        alert('设置失败：' + error.message);
      }
    });

    async function loadWorldEvents() {
      try {
        const response = await fetch('/api/world-events');
        const rows = await response.json();
        window.worldEvents = rows;

        if (!rows.length) {
          $('worldEventList').innerHTML =
            '<div class="empty">还没有世界专属节日。</div>';
          return;
        }

        $('worldEventList').innerHTML = rows.map((row) => `
          <div class="item">
            <div class="item-main">
              <div class="item-name">${escapeHtml(row.name)}</div>
              <div class="item-sub">${escapeHtml(row.rule_text || '无日期说明')}</div>
              <div class="item-actions">
                <button data-edit-event="${row.id}" type="button">编辑</button>
                <button data-delete-event="${row.id}" type="button">删除</button>
              </div>
            </div>
            <input class="item-toggle" type="checkbox"
              data-event-toggle="${row.id}" ${row.enabled ? 'checked' : ''}>
          </div>
        `).join('');
      } catch (error) {
        $('worldEventList').innerHTML =
          '<div class="empty">加载失败：' + escapeHtml(error.message) + '</div>';
      }
    }

    async function loadUserBirthday() {
      try {
        const response = await fetch('/api/settings/user-birthday');
        const data = await response.json();
        $('userBirthdayInput').value = data.birthday || '';
      } catch (e) {}
    }

    $('userBirthdayInput').addEventListener('change', async () => {
      const birthday = $('userBirthdayInput').value.trim();

      try {
        const response = await fetch('/api/settings/user-birthday', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ birthday })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '保存失败');
        }

        $('userBirthdayInput').blur();
      } catch (error) {
        alert('保存失败：' + error.message);
      }
    });

    async function loadBirthdays() {
      try {
        const response = await fetch('/api/characters');
        const rows = await response.json();

        if (!rows.length) {
          $('birthdayList').innerHTML =
            '<div class="empty">当前世界还没有角色。</div>';
          return;
        }

        $('birthdayList').innerHTML = rows.map((row) => {
          const avatar = row.avatar
            ? '<img src="' + escapeHtml(row.avatar) + '" alt="">'
            : escapeHtml(String(row.name || '?').slice(0, 1));

          return `
            <div class="item">
              <div class="avatar">${avatar}</div>
              <div class="item-main">
                <div class="item-name">${escapeHtml(row.name)}</div>
                <div class="item-sub">${escapeHtml(row.handle || '')}</div>
              </div>
              <input class="birthday-input" type="text"
                data-birthday-id="${row.id}"
                value="${escapeHtml(row.birthday || '')}"
                placeholder="例如：10-03">
            </div>
          `;
        }).join('');
      } catch (error) {
        $('birthdayList').innerHTML =
          '<div class="empty">加载失败：' + escapeHtml(error.message) + '</div>';
      }
    }

    $('birthdayList').addEventListener('change', async (event) => {
      const input = event.target.closest('[data-birthday-id]');
      if (!input) return;

      const id = input.dataset.birthdayId;
      const birthday = input.value.trim();

      try {
        const response = await fetch('/api/characters/' + id + '/birthday', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ birthday })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '保存失败');
        }

        input.blur();
      } catch (error) {
        alert('保存失败：' + error.message);
      }
    });

    function openEventModal(event) {
      editingEventId = event ? event.id : null;
      $('eventModalTitle').textContent = event ? '编辑世界节日' : '新建世界节日';
      $('eventName').value = event ? event.name || '' : '';
      $('eventRule').value = event ? event.rule_text || '' : '';
      $('eventEnabled').checked = event ? !!event.enabled : true;
      $('status').textContent = '等待操作。';
      $('eventModal').classList.add('open');
    }

    function closeEventModal() {
      $('eventModal').classList.remove('open');
      editingEventId = null;
    }

    $('addWorldEventBtn').addEventListener('click', () => openEventModal(null));
    $('cancelEventBtn').addEventListener('click', closeEventModal);
    $('eventModal').addEventListener('click', (event) => {
      if (event.target === $('eventModal')) closeEventModal();
    });

    $('eventForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const payload = {
        name: $('eventName').value.trim(),
        rule_text: $('eventRule').value.trim(),
        enabled: $('eventEnabled').checked
      };

      if (!payload.name) {
        $('status').textContent = '节日名字必填';
        return;
      }

      try {
        $('status').textContent = '保存中...';

        const url = editingEventId
          ? '/api/world-events/' + editingEventId
          : '/api/world-events';

        const method = editingEventId ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '保存失败');
        }

        closeEventModal();
        await loadWorldEvents();
      } catch (error) {
        $('status').textContent = '保存失败：' + error.message;
      }
    });

    $('worldEventList').addEventListener('click', async (event) => {
      const editId = event.target.dataset.editEvent;
      const deleteId = event.target.dataset.deleteEvent;

      if (editId) {
        const row = (window.worldEvents || []).find(
          (item) => Number(item.id) === Number(editId)
        );
        if (row) openEventModal(row);
        return;
      }

      if (deleteId) {
        if (!confirm('删除这个节日？')) return;

        try {
          const response = await fetch('/api/world-events/' + deleteId, {
            method: 'DELETE'
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || '删除失败');
          }

          await loadWorldEvents();
        } catch (error) {
          alert('删除失败：' + error.message);
        }
      }
    });

    $('worldEventList').addEventListener('change', async (event) => {
      const input = event.target.closest('[data-event-toggle]');
      if (!input) return;

      const id = input.dataset.eventToggle;
      const enabled = input.checked;
      const row = (window.worldEvents || []).find(
        (item) => Number(item.id) === Number(id)
      );

      if (!row) return;

      try {
        const response = await fetch('/api/world-events/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: row.name,
            rule_text: row.rule_text,
            enabled
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '设置失败');
        }

        row.enabled = enabled ? 1 : 0;
      } catch (error) {
        input.checked = !enabled;
        alert('设置失败：' + error.message);
      }
    });

    loadWorldLabel();
    loadHolidays();
    loadWorldEvents();
    loadUserBirthday();
    loadBirthdays();
  </script>
  <script src="/back-nav.js"></script>
</body>
</html>
