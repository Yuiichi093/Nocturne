<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7" id="themeColor">
  <meta name="apple-mobile-web-app-title" content="Nocturne">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Nocturne</title>
  <script src="/auth-guard.js"></script>
  <style>
    :root {
      --bg: #f7f7f7;
      --ink: #111111;
      --muted: #777777;
      --card: rgba(255,255,255,.72);
      --line: rgba(0,0,0,.09);
      --nav: rgba(255,255,255,.82);
      --shadow: 0 18px 50px rgba(0,0,0,.12);
      --safe: env(safe-area-inset-bottom, 0px);
    }

    html[data-theme="dark"] {
      --bg: #0a0a0a;
      --ink: #f4f4f4;
      --muted: #8b8b8b;
      --card: rgba(22,22,22,.72);
      --line: rgba(255,255,255,.12);
      --nav: rgba(18,18,18,.86);
      --shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body { min-height: 100dvh; }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }

    .app {
      min-height: 100dvh;
      padding-bottom: calc(96px + var(--safe));
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 22px 20px 12px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .topbar h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: .03em;
    }

    .clock {
      text-align: right;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    #clock {
      display: block;
      color: var(--ink);
      font-size: 15px;
      letter-spacing: .08em;
    }

    main { padding: 0 18px 24px; }

    .page { display: none; animation: fade .18s ease; }
    .page.active { display: block; }

    @keyframes fade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    .home-page {
      position: relative;
      margin: 0 -18px;
      min-height: calc(100dvh - 120px);
      border-radius: 0 0 30px 30px;
      overflow: hidden;
    }

    .home-bg {
      position: absolute;
      inset: 0;
      background-image: var(--home-bg, linear-gradient(150deg,#e9e9e9,#cfcfcf 45%,#f7f7f7));
      background-size: cover;
      background-position: center;
      filter: blur(2px);
      transform: scale(1.05);
    }

    .home-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.5) 55%,var(--bg) 100%);
    }

    html[data-theme="dark"] .home-overlay {
      background: linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.48) 55%,var(--bg) 100%);
    }

    .home-content {
      position: relative;
      z-index: 1;
      padding: 34px 18px 40px;
    }

    .profile-card {
      width: min(100%, 360px);
      margin: 0 auto;
      padding: 0 20px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,.7);
      background: var(--card);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      text-align: center;
    }

    html[data-theme="dark"] .profile-card {
      border-color: rgba(255,255,255,.16);
    }

    .avatar-wrap {
      position: relative;
      width: 94px;
      height: 94px;
      margin: -47px auto 14px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,.9);
      background: #dddddd;
      overflow: hidden;
    }

    html[data-theme="dark"] .avatar-wrap {
      border-color: rgba(255,255,255,.25);
      background: #222222;
    }

    .avatar-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .avatar-wrap span {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 28px;
      color: #777777;
    }

    .profile-card h2 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .handle {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .bio {
      margin: 0 auto 12px;
      max-width: 280px;
      font-size: 13px;
      line-height: 1.7;
    }

    .location {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      max-width: 380px;
      margin: 28px auto 0;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      background: transparent;
      color: var(--ink);
    }

    .app-icon .glyph {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      font-size: 22px;
      box-shadow: 0 8px 22px rgba(0,0,0,.06);
    }

    .app-icon span:last-child {
      font-size: 10px;
      color: var(--muted);
    }

    .placeholder-card {
      margin-top: 18px;
      padding: 36px 20px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
      text-align: center;
    }

    .settings-card {
      margin-top: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--card);
    }

    .settings-card h2 {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 600;
    }

    .account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }

    .account-row span:first-child {
      color: var(--muted);
      font-size: 11px;
    }

    .account-row strong {
      font-weight: 500;
      text-align: right;
      word-break: break-all;
    }

    .account-msg {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .field label {
      font-size: 11px;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: transparent;
      color: var(--ink);
      outline: none;
    }

    .field input:focus { border-color: var(--ink); }

    .primary-btn, .ghost-btn {
      width: 100%;
      margin-top: 8px;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--bg);
    }

    .ghost-btn {
      background: transparent;
      color: var(--ink);
    }

    .tabbar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(10px + var(--safe));
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      padding: 8px;
      border-radius: 28px;
      border: 1px solid var(--line);
      background: var(--nav);
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
    }

    .tabbar button {
      position: relative;
      padding: 9px 2px;
      border-radius: 18px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .02em;
    }

    .tabbar button.active {
      background: rgba(0,0,0,.07);
      color: var(--ink);
      font-weight: 600;
    }

    html[data-theme="dark"] .tabbar button.active {
      background: rgba(255,255,255,.12);
    }

    /* 朋友圈有未读回复时的数字小点 */
    .tab-badge {
      position: absolute;
      top: 1px;
      right: 2px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      line-height: 16px;
      text-align: center;
    }

    .tab-badge[hidden] { display: none; }

    html[data-theme="dark"] .tab-badge {
      background: #fff;
      color: #111;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(100px + var(--safe));
      z-index: 60;
      transform: translateX(-50%) translateY(10px);
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>

  <script>
    const $ = (id) => document.getElementById(id);

    const pageTitles = {
      home: '首页',
      messages: '消息',
      moments: '朋友圈',
      theater: '剧场',
      me: '我的'
    };

    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        el.classList.remove('show');
      }, 1800);
    }

    function setTab(tab) {
      document.querySelectorAll('.page').forEach((page) => {
        page.classList.toggle('active', page.dataset.page === tab);
      });

      document.querySelectorAll('.tabbar button').forEach((button) => {
        button.classList.toggle('active', button.dataset.tab === tab);
      });

      $('pageTitle').textContent = pageTitles[tab];
      document.body.dataset.tab = tab;
      sessionStorage.setItem('nocturne-last-tab', tab);
      window.scrollTo(0, 0);
    }

    document.querySelectorAll('.tabbar button').forEach((button) => {
      button.addEventListener('click', () => setTab(button.dataset.tab));
    });

    function updateClock() {
      const now = new Date();

      $('clock').textContent = now.toLocaleTimeString('zh-CN', {
        hour: '2-digit',
        minute: '2-digit'
      });

      $('date').textContent = now.toLocaleDateString('zh-CN', {
        month: '2-digit',
        day: '2-digit',
        weekday: 'short'
      });
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('saudade-theme', theme);
      $('themeColor').setAttribute(
        'content',
        theme === 'dark' ? '#0a0a0a' : '#f7f7f7'
      );
      $('themeToggle').textContent =
        theme === 'dark' ? '切换日间模式' : '切换夜间模式';
    }

    $('themeToggle').addEventListener('click', () => {
      const current = document.documentElement.dataset.theme || 'light';
      setTheme(current === 'light' ? 'dark' : 'light');
    });

    const savedTheme = localStorage.getItem('saudade-theme') || 'light';

    setTheme(savedTheme);
    const savedTab = sessionStorage.getItem('nocturne-last-tab');
    setTab(pageTitles[savedTab] ? savedTab : 'home');
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <script>
    // 装成 PWA：浏览器里「添加到主屏幕」用的就是这些
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          // 注册不上不影响正常使用，静默忽略
        });
      });
    }

  <script>
    // 账号卡片：显示当前账号、改密码、退出
    (function () {
      const nameEl = $('accountName');
      const msgEl = $('accountMsg');
      const oldPwdEl = $('accountOldPassword');
      const newPwdEl = $('accountNewPassword');
      const changeBtn = $('accountChangePassword');
      const logoutBtn = $('accountLogout');

      function setMsg(text) {
        msgEl.textContent = text || '';
      }

      async function loadAccount() {
        try {
          const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
          if (!res.ok) {
            nameEl.textContent = '未登录';
            return;
          }

          const data = await res.json();
          const user = data && data.user;
          if (!user) {
            nameEl.textContent = '未登录';
            return;
          }

          if (user.nickname && user.nickname !== user.username) {
            nameEl.textContent = user.nickname + '（' + user.username + '）';
          } else {
            nameEl.textContent = user.nickname || user.username || '未登录';
          }
        } catch (e) {
          nameEl.textContent = '读取失败';
        }
      }

      changeBtn.addEventListener('click', async () => {
        const oldPassword = oldPwdEl.value;
        const newPassword = newPwdEl.value;

        if (!oldPassword || !newPassword) {
          setMsg('请把当前密码和新密码都填上');
          return;
        }

        changeBtn.disabled = true;
        setMsg('');

        try {
          const res = await fetch('/api/auth/password', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              old_password: oldPassword,
              new_password: newPassword
            })
          });

          let data = null;
          try {
            data = await res.json();
          } catch (e) {}

          if (res.ok) {
            oldPwdEl.value = '';
            newPwdEl.value = '';
            setMsg('密码已更新');
            toast('密码已更新');
          } else {
            setMsg((data && data.error) || '改密码失败，请稍后再试');
          }
        } catch (e) {
          setMsg('连不上服务，请稍后再试');
        } finally {
          changeBtn.disabled = false;
        }
      });

      logoutBtn.addEventListener('click', async () => {
        logoutBtn.disabled = true;
        try {
          await fetch('/api/auth/logout', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: '{}'
          });
        } catch (e) {}
        location.replace('/login.html');
      });

      loadAccount();
    })();
  </script>
  <script src="/save-image.js"></script>
  <script src="/update-check.js"></script>
</body>
</html>
