<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nocturne · 模型 API</title>
  <script src="/auth-guard.js"></script>
  <style>
    :root {
      --bg: #f7f7f7;
      --ink: #111;
      --muted: #777;
      --line: rgba(0,0,0,.1);
      --card: #fff;
      --safe: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 20px 18px calc(30px + var(--safe));
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans SC", "PingFang SC", sans-serif;
    }

    a { color: var(--ink); }
    h1 { margin: 8px 0 4px; font-size: 28px; font-weight: 500; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 12px; line-height: 1.7; }

    .card {
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
    }

    h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }

    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    label { font-size: 11px; color: var(--muted); }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: transparent;
      color: var(--ink);
      outline: none;
    }

    input:focus { border-color: var(--ink); }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0;
      font-size: 13px;
    }

    .row input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    button {
      padding: 12px 14px;
      border: 1px solid var(--ink);
      border-radius: 15px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
    }

    button.ghost {
      background: transparent;
      color: var(--ink);
    }

    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .actions button { flex: 1; }

    .model-item {
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    .model-item:last-child { border-bottom: 0; }

    .model-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .model-name { font-size: 15px; font-weight: 600; }
    .model-meta { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.6; word-break: break-all; }
    .badge { padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 10px; }

    .item-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .item-actions button {
      padding: 10px 4px;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-actions button.on {
      background: #111;
      border-color: #111;
      color: #fff;
    }
    .item-actions button.key {
      grid-column: 1 / -1;
      background: #fff3cd;
      border-color: #f0d98a;
      color: #7a5c00;
    }
    @media (prefers-color-scheme: dark) {
      .item-actions button.key {
        background: #3a3a1f;
        border-color: #5c5c2e;
        color: #e8d98a;
      }
    }
    .badge.warn {
      background: #fff3cd;
      border-color: #f0d98a;
      color: #7a5c00;
    }
    @media (prefers-color-scheme: dark) {
      .item-actions button.on { background: #f5f5f5; border-color: #f5f5f5; color: #111; }
    }
    .role-summary {
      font-size: 13px;
      line-height: 1.7;
      opacity: .75;
      margin: -4px 0 14px;
      white-space: pre-line;
    }
    .role-summary b { font-weight: 600; opacity: 1; }
    .catalog {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .catalog button {
      padding: 7px 12px;
      font-size: 12.5px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .catalog .hint { font-size: 12.5px; opacity: .6; }

    #status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0,0,0,.05);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <a href="/" onclick="event.preventDefault(); nocturneBack()">← 返回</a>
  <h1>模型 API</h1>
  <p class="sub">
    先支持 OpenAI 兼容格式。Base URL 一般填到 <code>/v1</code>，
    例如 <code>https://api.example.com/v1</code>。测试会消耗少量 token。
  </p>

  <form class="card" id="modelForm">
    <h2>添加模型配置</h2>

    <div class="field">
      <label>名称</label>
      <input id="name" placeholder="例如：A家-聊天强模型" required>
    </div>

    <div class="field">
      <label>Base URL</label>
      <input id="base_url" placeholder="https://api.example.com/v1" required>
    </div>

    <div class="field">
      <label>API Key</label>
      <input id="api_key" type="password" placeholder="sk-..." required>
    </div>

    <div class="field">
      <label>模型名</label>
      <input id="model" placeholder="例如：gpt-4o-mini" required>
      <button class="ghost" id="catalogBtn" type="button">拉取模型列表</button>
      <div class="catalog" id="catalogList"></div>
    </div>

    <div class="field">
      <label>额外 Header（JSON，可空）</label>
      <input id="extra_headers" placeholder='{}'>
    </div>

    <div class="field">
      <label>Temperature</label>
      <input id="temperature" type="number" step="0.1" value="0.8">
    </div>

    <div class="field">
      <label>Max Tokens</label>
      <input id="max_tokens" type="number" value="2048">
    </div>

    <div class="row">
      <span>流式输出</span>
      <input id="stream" type="checkbox" checked>
    </div>

    <div class="row">
      <span>设为默认模型</span>
      <input id="is_default" type="checkbox">
    </div>

    <div class="row">
      <span>能看图（视觉模型）</span>
      <input id="is_vision" type="checkbox">
    </div>

    <div class="row">
      <span>能生图（绘画模型）</span>
      <input id="is_image" type="checkbox">
    </div>

    <div class="actions">
      <button type="submit">保存配置</button>
      <button type="button" class="ghost" id="resetBtn">清空</button>
    </div>

    <div id="status">等待操作。</div>
  </form>

  <div class="card">
    <h2>已保存的模型</h2>
    <div class="role-summary" id="roleSummary"></div>
    <div id="modelList">加载中...</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // 一眼看清哪个模型负责什么，省得猜「我刚才把哪个设成默认了」
    function renderRoleSummary(rows) {
      const box = $('roleSummary');

      if (!box) return;

      if (!rows.length) {
        box.textContent = '';
        return;
      }

      const byName = (row) => '<b>' + escapeHtml(row.name) + '</b>';
      const pick = (test) => rows.filter(test)[0];

      const chat = pick((row) => row.is_default) || rows[0];
      const vision = pick((row) => row.is_vision);
      const image = pick((row) => row.is_image);

      const lines = [
        '文字与思考：' + (chat ? byName(chat) : '没设，会乱用'),
        '看图：' + (vision ? byName(vision) : '没设，发图片时不会读图'),
        '生图：' + (image ? byName(image) : '没设，画不了图')
      ];

      box.innerHTML = lines.join('<br>');
    }

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setStatus(message) {
      $('status').textContent = message;
    }

    async function api(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || '请求失败');
      }
      return data;
    }

    async function loadModels() {
      try {
        const rows = await api('/api/models');

        renderRoleSummary(rows);

        if (!rows.length) {
          $('modelList').innerHTML = '<p class="sub">还没有模型配置。</p>';
          return;
        }

        $('modelList').innerHTML = rows.map((row) => `
          <div class="model-item">
            <div class="model-top">
              <div>
                <div class="model-name">${escapeHtml(row.name)}</div>
                <div class="model-meta">
                  ${escapeHtml(row.model)}<br>
                  ${escapeHtml(row.base_url)}
                </div>
              </div>
              ${row.is_default ? '<span class="badge">默认</span>' : ''}
              ${row.is_vision ? '<span class="badge">看图</span>' : ''}
              ${row.is_image ? '<span class="badge">生图</span>' : ''}
              ${row.has_key ? '' : '<span class="badge warn">没 Key</span>'}
            </div>
            <div class="item-actions">
              <button class="ghost" data-test="${row.id}" type="button">测试</button>
              <button class="ghost${row.is_vision ? ' on' : ''}" data-vision="${row.id}" data-on="${row.is_vision ? 1 : 0}" type="button">看图</button>
              <button class="ghost${row.is_image ? ' on' : ''}" data-image="${row.id}" data-on="${row.is_image ? 1 : 0}" type="button">生图</button>
              ${row.has_key ? '' : '<button class="ghost key" data-key="' + row.id + '" type="button">补填 Key</button>'}
              <button class="ghost" data-delete="${row.id}" type="button">删除</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        $('modelList').textContent = '加载失败：' + error.message;
      }
    }

    $('modelForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const payload = {
        name: $('name').value.trim(),
        base_url: $('base_url').value.trim(),
        api_key: $('api_key').value.trim(),
        model: $('model').value.trim(),
        extra_headers: $('extra_headers').value.trim() || '{}',
        temperature: Number($('temperature').value || 0.8),
        max_tokens: Number($('max_tokens').value || 2048),
        stream: $('stream').checked,
        is_default: $('is_default').checked,
        is_vision: $('is_vision').checked,
        is_image: $('is_image').checked
      };

      try {
        setStatus('保存中...');
        await api('/api/models', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        setStatus('已保存。建议点列表里的「测试」确认一下。');
        $('modelForm').reset();
        $('temperature').value = '0.8';
        $('max_tokens').value = '2048';
        $('stream').checked = true;
        await loadModels();
      } catch (error) {
        setStatus('保存失败：' + error.message);
      }
    });

    $('resetBtn').addEventListener('click', () => {
      $('modelForm').reset();
      $('temperature').value = '0.8';
      $('max_tokens').value = '2048';
      $('stream').checked = true;
      setStatus('已清空。');
    });

    $('catalogBtn').addEventListener('click', async () => {
      const baseUrl = $('base_url').value.trim();
      const list = $('catalogList');

      if (!baseUrl) {
        setStatus('先填 Base URL');
        return;
      }

      list.innerHTML = '<span class="hint">拉取中...</span>';

      try {
        const data = await api('/api/models/catalog', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base_url: baseUrl,
            api_key: $('api_key').value.trim(),
            extra_headers: $('extra_headers').value.trim() || '{}'
          })
        });

        const models = data.models || [];

        if (!models.length) {
          list.innerHTML = '<span class="hint">这个接口没给出模型列表。</span>';
          return;
        }

        list.innerHTML = models.map((item) => (
          '<button class="ghost" type="button" data-model-id="' +
          escapeHtml(item.id) + '">' + escapeHtml(item.id) + '</button>'
        )).join('');

        setStatus('拉到了 ' + models.length + ' 个模型，点一个填进模型名。');
      } catch (error) {
        list.innerHTML = '<span class="hint">' + escapeHtml(error.message) + '</span>';
        setStatus('拉取失败。');
      }
    });

    $('catalogList').addEventListener('click', (event) => {
      const id = event.target.dataset.modelId;

      if (!id) return;

      $('model').value = id;
      setStatus('已填入模型名：' + id + '，记得点「保存配置」。');
    });

    $('modelList').addEventListener('click', async (event) => {
      const testId = event.target.dataset.test;
      const deleteId = event.target.dataset.delete;
      const keyId = event.target.dataset.key;
      const visionId = event.target.dataset.vision;
      const imageId = event.target.dataset.image;

      if (testId) {
        try {
          setStatus('测试中，请稍等...');
          const data = await api('/api/models/' + testId + '/test', {
            method: 'POST'
          });
          const reply = data.reply || 'OK';
          setStatus(/\n/.test(reply) ? reply : '连接成功：' + reply);
        } catch (error) {
          setStatus('测试失败：' + error.message);
        }
      }

      if (visionId) {
        try {
          await api('/api/models/' + visionId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              is_vision: event.target.dataset.on === '1' ? 0 : 1
            })
          });
          setStatus(
            event.target.dataset.on === '1'
              ? '已取消看图。'
              : '已设为看图模型。聊天里发图片，角色就会先看图再回。'
          );
          await loadModels();
        } catch (error) {
          setStatus('设置失败：' + error.message);
        }
      }

      if (imageId) {
        try {
          await api('/api/models/' + imageId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              is_image: event.target.dataset.on === '1' ? 0 : 1
            })
          });
          setStatus(
            event.target.dataset.on === '1'
              ? '已取消生图。'
              : '已设为生图模型。聊天里可以「让 AI 画一张」了。'
          );
          await loadModels();
        } catch (error) {
          setStatus('设置失败：' + error.message);
        }
      }

      if (keyId) {
        const value = prompt('粘贴这个模型的 API Key（sk- 开头那一串）：');

        if (!value || !value.trim()) return;

        try {
          await api('/api/models/' + keyId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: value.trim() })
          });
          setStatus('Key 已补上，可以直接测试了。');
          await loadModels();
        } catch (error) {
          setStatus('补填失败：' + error.message);
        }
      }

      if (deleteId) {
        if (!confirm('确定删除这个模型配置？')) return;

        try {
          await api('/api/models/' + deleteId, { method: 'DELETE' });
          setStatus('已删除。');
          await loadModels();
        } catch (error) {
          setStatus('删除失败：' + error.message);
        }
      }
    });

    loadModels();
  </script>
  <script src="/back-nav.js"></script>
</body>
</html>
