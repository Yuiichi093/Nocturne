<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nocturne · 人设管理</title>
  <script src="/auth-guard.js"></script>
  <style>
    :root {
      --bg: #f7f7f7;
      --ink: #111;
      --muted: #777;
      --line: rgba(0,0,0,.1);
      --card: #fff;
      --safe: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 20px 18px calc(30px + var(--safe));
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans SC", "PingFang SC", sans-serif;
    }

    a { color: var(--ink); }
    h1 { margin: 8px 0 4px; font-size: 28px; font-weight: 500; }
    .sub { margin: 0 0 20px; color: var(--muted); font-size: 12px; line-height: 1.7; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 6px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
    }

    .tabs button {
      padding: 12px 8px;
      border: 0;
      border-radius: 15px;
      background: transparent;
      color: var(--muted);
      font: inherit;
    }

    .tabs button.active {
      background: var(--ink);
      color: var(--bg);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
    }

    h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }

    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    label { font-size: 11px; color: var(--muted); }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: transparent;
      color: var(--ink);
      outline: none;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.7;
    }

    input:focus, textarea:focus { border-color: var(--ink); }
    input[readonly] { color: var(--muted); }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0;
      font-size: 13px;
    }

    .row input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .actions button { flex: 1; }

    button {
      padding: 12px 14px;
      border: 1px solid var(--ink);
      border-radius: 15px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
    }

    button.ghost {
      background: transparent;
      color: var(--ink);
    }

    .item {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .item:last-child { border-bottom: 0; }

    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .item-main {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 0;
    }

    .thumb {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .item-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      word-break: break-all;
    }

    .badge {
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 400;
    }

    .item-actions { display: flex; gap: 8px; margin-top: 10px; }
    .item-actions button { padding: 9px 12px; font-size: 12px; }

    #status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0,0,0,.05);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .muted { color: var(--muted); font-size: 12px; }
  
    .add-new-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: transparent;
      color: var(--muted);
      font: inherit;
    }
  </style>
  <link rel="stylesheet" href="/vendor/cropper.min.css">
</head>
<body>
  <a href="/" onclick="event.preventDefault(); nocturneBack()">← 返回</a>
  <h1>人设管理</h1>
  <p class="sub">
    用户人设会作为“你”的身份；角色人设用于聊天和剧场。
    酒馆角色卡导入会在下一步接入，导入后也会出现在角色列表。
  </p>

  <div class="tabs">
    <button class="active" data-tab="personas" type="button">用户人设</button>
    <button data-tab="characters" type="button">角色人设</button>
  </div>

  <div class="panel active" id="personaPanel">
    <form class="card" id="personaForm" style="display:none">
      <h2 id="personaFormTitle">新增用户人设</h2>

      <div class="field">
        <label>名字</label>
        <input id="pName" placeholder="例如：柚" required>
      </div>

      <div class="field">
        <label>头像 URL</label>
        <input id="pAvatar" placeholder="上传后自动填入" readonly>
        <button class="ghost" id="pUploadBtn" type="button">上传头像</button>
        <input id="pAvatarFile" type="file" accept="image/*" hidden>
      </div>

      <div class="field">
        <label>简介</label>
        <input id="pBio" placeholder="一句话介绍">
      </div>

      <div class="field">
        <label>人设内容</label>
        <textarea id="pPersona" placeholder="外貌、性格、说话方式、背景、喜好、禁忌……"></textarea>
      </div>

      <div class="field">
        <label>参考图（给生图模型看的样子参考，可以放多张）</label>
        <div class="ref-picker" id="pRefPicker"></div>
        <button class="ghost" id="pRefUploadBtn" type="button">＋ 添加参考图</button>
        <input id="pRefFile" type="file" accept="image/*" multiple hidden>
        <p class="ref-hint">最多放 4 张会用于生图；正脸一张最有用，再加个侧脸或全身更好。</p>
      </div>

      <div class="row">
        <span>设为默认用户人设</span>
        <input id="pDefault" type="checkbox">
      </div>

      <div class="actions">
        <button type="submit">保存用户人设</button>
        <button class="ghost" id="pReset" type="button">清空</button>
      </div>

      <div id="status">等待操作。</div>
    </form>

    <div class="card">
      <h2>用户人设列表</h2>
      <div id="personaList">加载中...</div>
    </div>

    <button class="add-new-btn" id="addPersonaBtn" type="button">+ 添加用户人设</button>
  </div>

  <div class="panel" id="characterPanel">
    <form class="card" id="characterForm" style="display:none">
      <h2 id="characterFormTitle">新增角色人设</h2>

      <div class="field">
        <label>角色名</label>
        <input id="cName" placeholder="例如：雪一" required>
      </div>

      <div class="field">
        <label>用户名 / 称呼</label>
        <input id="cHandle" placeholder="@yuiichi">
      </div>

      <div class="field">
        <label>头像 URL</label>
        <input id="cAvatar" placeholder="上传后自动填入" readonly>
        <button class="ghost" id="cUploadBtn" type="button">上传头像</button>
        <input id="cAvatarFile" type="file" accept="image/*" hidden>
      </div>

      <div class="field">
        <label>性格</label>
        <textarea id="cPersonality" placeholder="性格、脾气、习惯、弱点……"></textarea>
      </div>

      <div class="field">
        <label>背景</label>
        <textarea id="cBackground" placeholder="身世、经历、世界观关系……"></textarea>
      </div>

      <div class="field">
        <label>说话方式</label>
        <textarea id="cSpeaking" placeholder="语气、口癖、用词、称呼方式……"></textarea>
      </div>

      <div class="field">
        <label>开场白</label>
        <textarea id="cOpening" placeholder="第一次聊天时说的话"></textarea>
      </div>

      <div class="field">
        <label>完整人设</label>
        <textarea id="cPersona" placeholder="完整角色设定，可写长文本"></textarea>
      </div>

      <div class="field">
        <label>参考图（给生图模型看的外貌参考，可以放多张）</label>
        <div class="ref-picker" id="cRefPicker"></div>
        <button class="ghost" id="cRefUploadBtn" type="button">＋ 添加参考图</button>
        <input id="cRefFile" type="file" accept="image/*" multiple hidden>
        <p class="ref-hint">最多放 4 张会用于生图；正脸一张最有用，再加个侧脸或全身更好。</p>
      </div>

      <div class="field">
        <label>标签</label>
        <input id="cTags" placeholder="例如：冷淡, 雨天, 旧书店">
      </div>

      <div class="field">
        <label>生日</label>
        <input id="cBirthday" placeholder="例如：10-03 或 农历八月十五">
      </div>

      <div class="actions">
        <button type="submit">保存角色人设</button>
        <button class="ghost" id="cReset" type="button">清空</button>
      </div>
    </form>

    <div class="card">
      <h2>角色列表</h2>
      <div id="characterList">加载中...</div>
    </div>

    <button class="add-new-btn" id="addCharacterBtn" type="button">+ 添加角色人设</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    let personaRows = [];
    let characterRows = [];
    let personaEditId = null;
    let characterEditId = null;

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setStatus(message) {
      $('status').textContent = message;
    }

    async function api(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || '请求失败');
      }
      return data;
    }

    function setTab(tab) {
      document.querySelectorAll('.tabs button').forEach((button) => {
        button.classList.toggle('active', button.dataset.tab === tab);
      });
      $('personaPanel').classList.toggle('active', tab === 'personas');
      $('characterPanel').classList.toggle('active', tab === 'characters');
      window.scrollTo(0, 0);
    }

    document.querySelectorAll('.tabs button').forEach((button) => {
      button.addEventListener('click', () => setTab(button.dataset.tab));
    });

    async function uploadImage(file) {
      const formData = new FormData();
      formData.append('image', file);

      const response = await fetch('/api/upload', {
        method: 'POST',
        body: formData
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || '上传失败');
      }

      return data.url;
    }

    async function loadPersonas() {
      try {
        personaRows = await api('/api/personas');
        renderPersonas();
      } catch (error) {
        $('personaList').textContent = '加载失败：' + error.message;
      }
    }

    // 列表里直接标出这个人有几张参考图，省得点进去才发现是空的
    function refBadge(row) {
      const total = Array.isArray(row.ref_images)
        ? row.ref_images.length
        : (row.ref_image ? 1 : 0);

      return total ? '<span class="badge">参考图 ' + total + '</span>' : '';
    }

    function renderPersonas() {
      if (!personaRows.length) {
        $('personaList').innerHTML = '<p class="muted">还没有用户人设。</p>';
        return;
      }

      $('personaList').innerHTML = personaRows.map((row) => `
        <div class="item">
          <div class="item-top">
            <div class="item-main">
              ${row.avatar ? `<img class="thumb" src="${escapeHtml(row.avatar)}" alt="">` : ''}
              <div>
                <div class="item-name">
                  ${escapeHtml(row.name)}
                  ${row.is_default ? '<span class="badge">默认</span>' : ''}
                  ${refBadge(row)}
                </div>
                <div class="item-meta">${escapeHtml(row.bio || '')}</div>
              </div>
            </div>
          </div>
          <div class="item-actions">
            <button class="ghost" data-edit-persona="${row.id}" type="button">编辑</button>
            <button class="ghost" data-del-persona="${row.id}" type="button">删除</button>
          </div>
        </div>
      `).join('');
    }

    function resetPersonaForm() {
      personaEditId = null;
      $('personaForm').reset();
      personaRefs = [];
      renderRefPicker('pRefPicker', personaRefs);
      $('personaFormTitle').textContent = '新增用户人设';
      $('pDefault').checked = false;
      $('personaForm').style.display = 'none';
    }

    $('personaForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const payload = {
        name: $('pName').value.trim(),
        avatar: $('pAvatar').value.trim(),
        bio: $('pBio').value.trim(),
        persona: $('pPersona').value.trim(),
        ref_images: personaRefs.slice(),
        is_default: $('pDefault').checked
      };

      if (!payload.name) {
        setStatus('用户人设名字必填');
        return;
      }

      try {
        const url = personaEditId ? '/api/personas/' + personaEditId : '/api/personas';
        const method = personaEditId ? 'PUT' : 'POST';

        await api(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        setStatus(personaEditId ? '用户人设已更新。' : '用户人设已创建。');
        resetPersonaForm();
        await loadPersonas();
      } catch (error) {
        setStatus('保存失败：' + error.message);
      }
    });

    $('pReset').addEventListener('click', resetPersonaForm);

    $('pUploadBtn').addEventListener('click', () => {
      $('pAvatarFile').click();
    });

    $('pAvatarFile').addEventListener('change', async () => {
      const file = $('pAvatarFile').files && $('pAvatarFile').files[0];
      if (!file) return;

      try {
        setStatus('头像上传中...');
        const url = await uploadImage(file);
        $('pAvatar').value = url;
        setStatus('头像已上传。');
      } catch (error) {
        setStatus('上传失败：' + error.message);
      }

      $('pAvatarFile').value = '';
    });

    // 参考图可以挂多张，状态放在这两个数组里，保存时整体提交
    let personaRefs = [];
    let characterRefs = [];

    function renderRefPicker(containerId, refs) {
      const box = $(containerId);
      box.textContent = '';

      refs.forEach((url, index) => {
        const thumb = document.createElement('div');
        thumb.className = 'ref-thumb';

        const img = document.createElement('img');
        img.src = url;
        img.alt = '参考图';
        thumb.appendChild(img);

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'ref-remove';
        remove.textContent = '×';
        remove.setAttribute('aria-label', '移除这张参考图');
        remove.addEventListener('click', () => {
          refs.splice(index, 1);
          renderRefPicker(containerId, refs);
        });
        thumb.appendChild(remove);

        box.appendChild(thumb);
      });

      if (!refs.length) {
        const empty = document.createElement('span');
        empty.className = 'ref-empty';
        empty.textContent = '还没放参考图';
        box.appendChild(empty);
      }
    }

    async function addRefFiles(fileList, refs, containerId) {
      const files = Array.from(fileList || []);
      if (!files.length) return;

      for (const file of files) {
        if (refs.length >= 12) {
          setStatus('最多 12 张，够用了。');
          break;
        }

        try {
          setStatus('参考图上传中（' + (refs.length + 1) + '）...');
          const url = await uploadImage(file);
          refs.push(url);
          renderRefPicker(containerId, refs);
        } catch (error) {
          setStatus('上传失败：' + error.message);
          return;
        }
      }

      setStatus('参考图已上传，共 ' + refs.length + ' 张。记着点保存。');
    }

    $('pRefUploadBtn').addEventListener('click', () => {
      $('pRefFile').click();
    });

    $('pRefFile').addEventListener('change', async () => {
      await addRefFiles($('pRefFile').files, personaRefs, 'pRefPicker');
      $('pRefFile').value = '';
    });

    $('cRefUploadBtn').addEventListener('click', () => {
      $('cRefFile').click();
    });

    $('cRefFile').addEventListener('change', async () => {
      await addRefFiles($('cRefFile').files, characterRefs, 'cRefPicker');
      $('cRefFile').value = '';
    });

    $('personaList').addEventListener('click', async (event) => {
      const editId = event.target.dataset.editPersona;
      const delId = event.target.dataset.delPersona;

      if (editId) {
        const row = personaRows.find((item) => Number(item.id) === Number(editId));
        if (!row) return;

        personaEditId = Number(editId);
        $('personaFormTitle').textContent = '编辑用户人设';
        $('pName').value = row.name || '';
        $('pAvatar').value = row.avatar || '';
        $('pBio').value = row.bio || '';
        $('pPersona').value = row.persona || '';
        personaRefs = Array.isArray(row.ref_images) && row.ref_images.length
          ? row.ref_images.slice()
          : (row.ref_image ? [row.ref_image] : []);
        renderRefPicker('pRefPicker', personaRefs);
        $('pDefault').checked = !!row.is_default;
        $('personaForm').style.display = 'block';
        setTab('personas');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      if (delId) {
        if (!confirm('确定删除这个用户人设？')) return;

        try {
          await api('/api/personas/' + delId, { method: 'DELETE' });
          setStatus('用户人设已删除。');
          await loadPersonas();
        } catch (error) {
          setStatus('删除失败：' + error.message);
        }
      }
    });

    async function loadCharacters() {
      try {
        characterRows = await api('/api/characters');
        renderCharacters();
      } catch (error) {
        $('characterList').textContent = '加载失败：' + error.message;
      }
    }

    function renderCharacters() {
      if (!characterRows.length) {
        $('characterList').innerHTML = '<p class="muted">还没有角色。下一步会加入酒馆角色卡导入。</p>';
        return;
      }

      $('characterList').innerHTML = characterRows.map((row) => `
        <div class="item">
          <div class="item-top">
            <div class="item-main">
              ${row.avatar ? `<img class="thumb" src="${escapeHtml(row.avatar)}" alt="">` : ''}
              <div>
                <div class="item-name">
                  ${escapeHtml(row.name)}
                  ${refBadge(row)}
                </div>
                <div class="item-meta">
                  ${escapeHtml(row.handle || '')}
                  ${row.tags ? ' · ' + escapeHtml(row.tags) : ''}
                </div>
              </div>
            </div>
          </div>
          <div class="item-actions">
            <button class="ghost" data-edit-character="${row.id}" type="button">编辑</button>
            <button class="ghost" data-del-character="${row.id}" type="button">删除</button>
          </div>
        </div>
      `).join('');
    }

    function resetCharacterForm() {
      characterEditId = null;
      $('characterForm').reset();
      characterRefs = [];
      renderRefPicker('cRefPicker', characterRefs);
      $('characterFormTitle').textContent = '新增角色人设';
      $('characterForm').style.display = 'none';
    }

    $('characterForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const payload = {
        name: $('cName').value.trim(),
        handle: $('cHandle').value.trim(),
        avatar: $('cAvatar').value.trim(),
        personality: $('cPersonality').value.trim(),
        background: $('cBackground').value.trim(),
        speaking_style: $('cSpeaking').value.trim(),
        opening_line: $('cOpening').value.trim(),
        persona: $('cPersona').value.trim(),
        tags: $('cTags').value.trim(),
        birthday: $('cBirthday').value.trim(),
        ref_images: characterRefs.slice()
      };

      if (!payload.name) {
        setStatus('角色名字必填');
        return;
      }

      try {
        const url = characterEditId ? '/api/characters/' + characterEditId : '/api/characters';
        const method = characterEditId ? 'PUT' : 'POST';

        await api(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        setStatus(characterEditId ? '角色人设已更新。' : '角色人设已创建。');
        resetCharacterForm();
        await loadCharacters();
      } catch (error) {
        setStatus('保存失败：' + error.message);
      }
    });

    $('cReset').addEventListener('click', resetCharacterForm);

    $('cUploadBtn').addEventListener('click', () => {
      $('cAvatarFile').click();
    });

    $('cAvatarFile').addEventListener('change', async () => {
      const file = $('cAvatarFile').files && $('cAvatarFile').files[0];
      if (!file) return;

      try {
        setStatus('头像上传中...');
        const url = await uploadImage(file);
        $('cAvatar').value = url;
        setStatus('头像已上传。');
      } catch (error) {
        setStatus('上传失败：' + error.message);
      }

      $('cAvatarFile').value = '';
    });

    $('characterList').addEventListener('click', async (event) => {
      const editId = event.target.dataset.editCharacter;
      const delId = event.target.dataset.delCharacter;

      if (editId) {
        const row = characterRows.find((item) => Number(item.id) === Number(editId));
        if (!row) return;

        characterEditId = Number(editId);
        $('characterFormTitle').textContent = '编辑角色人设';
        $('cName').value = row.name || '';
        $('cHandle').value = row.handle || '';
        $('cAvatar').value = row.avatar || '';
        $('cPersonality').value = row.personality || '';
        $('cBackground').value = row.background || '';
        $('cSpeaking').value = row.speaking_style || '';
        $('cOpening').value = row.opening_line || '';
        $('cPersona').value = row.persona || '';
        $('cTags').value = row.tags || '';
        $('cBirthday').value = row.birthday || '';
        characterRefs = Array.isArray(row.ref_images) && row.ref_images.length
          ? row.ref_images.slice()
          : (row.ref_image ? [row.ref_image] : []);
        renderRefPicker('cRefPicker', characterRefs);
        $('characterForm').style.display = 'block';
        setTab('characters');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      if (delId) {
        if (!confirm('确定删除这个角色？')) return;

        try {
          await api('/api/characters/' + delId, { method: 'DELETE' });
          setStatus('角色已删除。');
          await loadCharacters();
        } catch (error) {
          setStatus('删除失败：' + error.message);
        }
      }
    });

    // 参考图的空格子要先画出来（声明变量之后才能碰，不然整页脚本会停在 ReferenceError）
    renderRefPicker('pRefPicker', personaRefs);
    renderRefPicker('cRefPicker', characterRefs);

    loadPersonas();
    loadCharacters();
  </script>
  <script src="/vendor/cropper.min.js"></script>
  <script src="/crop.js"></script>
  <script id="personas-add-buttons">
    (function () {
      function bind(addId, formId, titleId, titleText) {
        const button = document.getElementById(addId);
        const form = document.getElementById(formId);
        const title = document.getElementById(titleId);

        if (!button || !form) return;
        if (button.dataset.bound === '1') return;

        button.dataset.bound = '1';

        button.addEventListener('click', () => {
          form.reset();
          if (title) title.textContent = titleText;
          form.style.display = 'block';
          form.scrollIntoView({ behavior: 'smooth' });
        });
      }

      bind('addPersonaBtn', 'personaForm', 'personaFormTitle', '新增用户人设');
      bind('addCharacterBtn', 'characterForm', 'characterFormTitle', '新增角色人设');
    })();
  </script>
  <script src="/back-nav.js"></script>
</body>
</html>
