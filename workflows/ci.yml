name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci --omit=dev || npm install --omit=dev

      - name: 语法检查
        run: npm run check

      - name: 起服务并冒烟（含账号流程）
        run: |
          PORT=18787 node server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18787/api/health > /dev/null; then
              echo "服务起来了"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18787/api/health > /dev/null

          # 没登录：登录页可访问，接口与页面被挡
          curl -sf http://127.0.0.1:18787/login.html > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18787/api/chats)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18787/index.html)" = "302"

          # 注册第一个账号后会带上 cookie，受保护的内容应该能读
          curl -sf -c /tmp/ci.cookies -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-password"}' \
            http://127.0.0.1:18787/api/auth/register > /dev/null
          curl -sf -b /tmp/ci.cookies http://127.0.0.1:18787/api/chats > /dev/null
          curl -sf -b /tmp/ci.cookies http://127.0.0.1:18787/api/auth/me > /dev/null
          curl -sf -b /tmp/ci.cookies http://127.0.0.1:18787/index.html > /dev/null

          kill $SERVER_PID
          rm -rf data
