<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nocturne · 世界观</title>
  <script src="/auth-guard.js"></script>
  <style>
    :root {
      --bg: #f7f7f7;
      --ink: #111;
      --muted: #777;
      --line: rgba(0,0,0,.1);
      --card: #fff;
      --safe: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 18px 18px calc(30px + var(--safe));
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans SC", "PingFang SC", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--ink);
      font-size: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
    }

    .section-title {
      margin: 24px 0 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
    }

    .world-list {
      display: grid;
      gap: 12px;
    }

    .world-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
    }

    .world-card.active {
      border-color: var(--ink);
    }

    .world-card h2 {
      margin: 0 0 5px;
      font-size: 18px;
      font-weight: 600;
    }

    .world-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .world-card button {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 1px solid var(--ink);
      border-radius: 14px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
      font-size: 12px;
    }

    .world-card button:disabled {
      opacity: .45;
    }

    .form-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .field label {
      color: var(--muted);
      font-size: 11px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: transparent;
      color: var(--ink);
      outline: none;
      font: inherit;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.7;
    }

    .form-card button {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--ink);
      border-radius: 15px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
    }

    #status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .active-label {
      display: inline-block;
      margin-left: 6px;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 400;
      vertical-align: middle;
    }
  
    .world-actions {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .world-actions button.ghost {
      background: transparent;
      color: var(--ink);
    }

    .edit-backdrop {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: none;
      align-items: flex-end;
      background: rgba(0,0,0,.35);
    }

    .edit-backdrop.open {
      display: flex;
    }

    .edit-panel {
      width: 100%;
      padding: 18px 18px calc(22px + var(--safe));
      border-radius: 28px 28px 0 0;
      background: var(--bg);
    }

    .edit-panel h2 {
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 600;
    }

    .edit-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .edit-actions button {
      flex: 1;
      padding: 13px;
      border: 1px solid var(--ink);
      border-radius: 15px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
    }

    .edit-actions button.ghost {
      background: transparent;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <header>
    <button class="back" onclick="nocturneBack()" type="button">‹</button>
    <h1>世界观</h1>
  </header>

  <div class="section-title">当前世界观</div>
  <div id="activeWorld" class="world-card active">
    <div>
      <h2>加载中...</h2>
      <p></p>
    </div>
  </div>

  <div class="section-title">全部世界观</div>
  <div class="world-list" id="worldList">加载中...</div>

  <div class="section-title">新建世界观</div>
  <form class="form-card" id="worldForm">
    <div class="field">
      <label>名字</label>
      <input id="worldName" placeholder="给它起个名字" required>
    </div>

    <div class="field">
      <label>描述</label>
      <textarea id="worldDescription" placeholder="这个世界的基本设定"></textarea>
    </div>

    <button type="submit">创建并切换</button>
    <div id="status">等待操作。</div>
  </form>

  <div class="edit-backdrop" id="editModal">
    <div class="edit-panel">
      <h2>编辑世界观</h2>

      <div class="field">
        <label>名字</label>
        <input id="editWorldName">
      </div>

      <div class="field">
        <label>描述</label>
        <textarea id="editWorldDescription"></textarea>
      </div>

      <div class="edit-actions">
        <button class="ghost" id="editCancel" type="button">取消</button>
        <button id="editSave" type="button">保存</button>
      </div>

      <div id="editStatus"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function loadWorlds() {
      try {
        const response = await fetch('/api/worlds');
        const rows = await response.json();

        if (!response.ok || !Array.isArray(rows)) {
          throw new Error((rows && rows.error) || '读取世界观失败');
        }

        const active = rows.find((item) => item.is_active);

        if (active) {
          $('activeWorld').innerHTML = `
            <div data-edit="${active.id}">
              <h2>${escapeHtml(active.name)}<span class="active-label">当前</span></h2>
              <p>${escapeHtml(active.description || '没有描述')}</p>
            </div>
            <div class="world-actions">
              <button data-edit="${active.id}" class="ghost" type="button">编辑</button>
            </div>
          `;
        }

        $('worldList').innerHTML = rows.map((row) => `
          <div class="world-card ${row.is_active ? 'active' : ''}" ${row.is_active ? `data-edit="${row.id}"` : `data-switch="${row.id}"`}>
            <div>
              <h2>${escapeHtml(row.name)}</h2>
              <p>${escapeHtml(row.description || '没有描述')}</p>
            </div>
            <div class="world-actions">
              <button data-edit="${row.id}" class="ghost" type="button">编辑</button>
              <button
                data-switch="${row.id}"
                type="button"
                ${row.is_active ? 'disabled' : ''}
              >${row.is_active ? '当前' : '切换'}</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        $('worldList').innerHTML =
          '<div class="world-empty">加载失败：' + escapeHtml(error.message) + '</div>' +
          '<button class="ghost-btn" id="worldsRetry" type="button">重试</button>';
        const retry = $('worldsRetry');
        if (retry) retry.addEventListener('click', loadWorlds);
      }
    }

    async function switchWorld(id) {
      const response = await fetch('/api/worlds/' + id + '/switch', {
        method: 'POST'
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || '切换失败');
      }

      localStorage.setItem('nocturne-active-world-id', String(data.world.id));
      location.href = '/';
    }

    let editingWorld = null;

    async function openEdit(id) {
      try {
        const response = await fetch('/api/worlds/' + id);
        const world = await response.json();

        if (!response.ok) {
          throw new Error(world.error || '读取失败');
        }

        editingWorld = world;
        $('editWorldName').value = world.name || '';
        $('editWorldDescription').value = world.description || '';
        $('editStatus').textContent = '';
        $('editModal').classList.add('open');
      } catch (error) {
        alert('读取失败：' + error.message);
      }
    }

    function closeEdit() {
      editingWorld = null;
      $('editModal').classList.remove('open');
    }

    $('editCancel').addEventListener('click', closeEdit);

    $('editSave').addEventListener('click', async () => {
      if (!editingWorld) return;

      const name = $('editWorldName').value.trim();
      const description = $('editWorldDescription').value.trim();

      if (!name) {
        $('editStatus').textContent = '名字不能为空';
        return;
      }

      try {
        $('editSave').textContent = '保存中...';
        $('editSave').disabled = true;

        const response = await fetch('/api/worlds/' + editingWorld.id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            description,
            cover: editingWorld.cover || '',
            theme_json: editingWorld.theme_json || '{}'
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '保存失败');
        }

        closeEdit();
        await loadWorlds();
      } catch (error) {
        $('editStatus').textContent = '保存失败：' + error.message;
      } finally {
        $('editSave').textContent = '保存';
        $('editSave').disabled = false;
      }
    });

    function handleWorldClick(event) {
      // 以前只认按钮本身，点世界名/描述这类文字区域完全没反应，
      // 现在往上找最近的带 data 的元素，整张卡片都能点。
      const hit = event.target.closest('[data-edit], [data-switch]');
      if (!hit) return;

      const editId = hit.dataset.edit;
      if (editId) {
        openEdit(editId);
        return;
      }

      const id = hit.dataset.switch;
      if (!id) return;

      switchWorld(id).catch((error) => {
        alert('切换失败：' + error.message);
      });
    }

    $('activeWorld').addEventListener('click', handleWorldClick);
    $('worldList').addEventListener('click', handleWorldClick);

    $('worldForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const name = $('worldName').value.trim();
      const description = $('worldDescription').value.trim();

      if (!name) {
        $('status').textContent = '世界观名字必填';
        return;
      }

      try {
        $('status').textContent = '创建中...';

        const response = await fetch('/api/worlds', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '创建失败');
        }

        await switchWorld(data.world.id);
      } catch (error) {
        $('status').textContent = '创建失败：' + error.message;
      }
    });

    loadWorlds();
  </script>
  <script src="/back-nav.js"></script>
</body>
</html>
